# Builds the Puppeteer Mobile Android app (APK) and uploads it as an artifact.
name: mobile-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app/apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Use Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile-app/apk/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PuppeteerMobile-apk
          path: mobile-app/apk/android/app/build/outputs/apk/debug/app-debug.apk
