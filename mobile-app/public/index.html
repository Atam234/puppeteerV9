<!doctype html>
<html lang="fil">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Puppeteer" />
    <meta name="description" content="Control a real browser from your phone with Puppeteer." />
    <title>Puppeteer Mobile</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <!-- Login -->
    <section id="login" class="login" hidden>
      <div class="login-card">
        <img src="/icons/icon.svg" alt="" width="72" height="72" />
        <h1>Puppeteer Mobile</h1>
        <p data-i18n="loginHelp">
          Ilagay ang access token na makikita sa terminal kung saan mo pinatakbo ang server.
        </p>
        <form id="login-form">
          <input
            id="login-token"
            type="password"
            autocomplete="current-password"
            data-i18n-ph="tokenPh"
            placeholder="Access token"
            required
          />
          <button class="btn primary block" type="submit" data-i18n="login">Pumasok</button>
        </form>
        <p id="login-error" class="error-text" role="alert"></p>
      </div>
    </section>

    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="brand">
          <img src="/icons/icon.svg" alt="" width="28" height="28" />
          <span id="page-title">Live</span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btn-history" aria-label="History" title="History">
            <svg viewBox="0 0 24 24"><path d="M12 8v4l3 2M3.05 11a9 9 0 1 1 .5 4M3 4v5h5" /></svg>
          </button>
          <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
          </button>
        </div>
      </header>

      <main class="views">
        <!-- ============ LIVE ============ -->
        <section class="view" id="view-live" data-title="Live">
          <form class="urlbar" id="live-form">
            <button type="button" class="icon-btn sm" id="live-back" aria-label="Back">
              <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
            </button>
            <button type="button" class="icon-btn sm" id="live-forward" aria-label="Forward">
              <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6" /></svg>
            </button>
            <input
              id="live-url"
              type="url"
              inputmode="url"
              autocapitalize="off"
              autocomplete="url"
              spellcheck="false"
              placeholder="example.com"
              enterkeyhint="go"
            />
            <button type="button" class="icon-btn sm" id="live-reload" aria-label="Reload">
              <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8M21 3v5h-5" /></svg>
            </button>
          </form>

          <div class="live-stage" id="live-stage">
            <div class="live-empty" id="live-empty">
              <svg viewBox="0 0 24 24" class="big"><rect x="3" y="4" width="18" height="14" rx="2" /><path d="M8 21h8M12 18v3" /></svg>
              <p data-i18n="liveEmpty">Mag-type ng website sa itaas at pindutin ang Go para magbukas ng totoong browser.</p>
              <button class="btn primary" id="live-start" data-i18n="liveStart">Simulan ang browser</button>
            </div>
            <img id="live-screen" alt="Live browser screen" hidden draggable="false" />
            <div class="live-loading" id="live-loading" hidden><span class="spinner"></span></div>
          </div>

          <div class="live-toolbar" id="live-toolbar" hidden>
            <button class="chip" id="live-keyboard">⌨️ <span data-i18n="type">Mag-type</span></button>
            <button class="chip" id="live-enter">↵ Enter</button>
            <button class="chip" id="live-tab">⇥ Tab</button>
            <button class="chip" id="live-shot">📸 <span data-i18n="capture">Capture</span></button>
            <button class="chip" id="live-js">{ } JS</button>
            <select class="chip select" id="live-device" aria-label="Device"></select>
            <button class="chip danger" id="live-stop">✕ <span data-i18n="stop">Isara</span></button>
          </div>
          <form class="live-type" id="live-type-form" hidden>
            <input id="live-type-input" type="text" autocomplete="off" data-i18n-ph="typeHere" placeholder="I-type dito…" enterkeyhint="send" />
            <button class="btn primary" type="submit" data-i18n="send">Ipadala</button>
          </form>
          <p class="hint" id="live-hint" hidden data-i18n="liveHint">
            Tap = click · Swipe = scroll · Tap muna sa text box bago mag-type.
          </p>
        </section>

        <!-- ============ CAPTURE ============ -->
        <section class="view" id="view-capture" data-title="Capture" hidden>
          <div class="segmented" role="tablist">
            <button role="tab" class="active" data-mode="screenshot" data-i18n="screenshot">Screenshot</button>
            <button role="tab" data-mode="pdf">PDF</button>
          </div>
          <form class="card form" id="capture-form">
            <label class="field">
              <span>Website URL</span>
              <input name="url" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://example.com" required />
            </label>
            <div class="shot-only">
              <label class="field">
                <span data-i18n="device">Device</span>
                <select name="device" class="device-select"></select>
              </label>
              <div class="row">
                <label class="field">
                  <span>Format</span>
                  <select name="format">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPG</option>
                    <option value="webp">WEBP</option>
                  </select>
                </label>
                <label class="field">
                  <span data-i18n="delay">Hintay (segundo)</span>
                  <input name="delay" type="number" min="0" max="15" value="0" inputmode="numeric" />
                </label>
              </div>
              <label class="switch"><input type="checkbox" name="fullPage" checked /><span data-i18n="fullPage">Buong page (full page)</span></label>
              <label class="switch"><input type="checkbox" name="darkMode" /><span data-i18n="darkMode">Dark mode</span></label>
            </div>
            <div class="pdf-only" hidden>
              <div class="row">
                <label class="field">
                  <span data-i18n="paper">Papel</span>
                  <select name="paper">
                    <option>A4</option><option>Letter</option><option>Legal</option><option>A3</option><option>A5</option>
                  </select>
                </label>
                <label class="field">
                  <span>Margin</span>
                  <select name="margin">
                    <option value="0">0</option><option value="0.5cm">0.5 cm</option><option value="1cm" selected>1 cm</option><option value="2cm">2 cm</option>
                  </select>
                </label>
              </div>
              <label class="switch"><input type="checkbox" name="landscape" /><span>Landscape</span></label>
              <label class="switch"><input type="checkbox" name="background" checked /><span data-i18n="printBg">Isama ang background</span></label>
            </div>
            <details class="advanced">
              <summary data-i18n="advanced">Advanced</summary>
              <label class="field shot-only">
                <span data-i18n="elementOnly">Isang element lang (CSS selector)</span>
                <input name="selector" placeholder="#main, .header" autocapitalize="off" spellcheck="false" />
              </label>
              <label class="field">
                <span data-i18n="hideEls">Itago ang mga element (cookie banner, ads)</span>
                <input name="hide" placeholder=".cookie-banner, #ads" autocapitalize="off" spellcheck="false" />
              </label>
            </details>
            <button class="btn primary block" type="submit" id="capture-submit">
              <span data-i18n="capture">Capture</span>
            </button>
          </form>
          <div class="result" id="capture-result" hidden></div>
        </section>

        <!-- ============ EXTRACT ============ -->
        <section class="view" id="view-extract" data-title="Extract" hidden>
          <form class="card form" id="extract-form">
            <label class="field">
              <span>Website URL</span>
              <input name="url" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://example.com" required />
            </label>
            <span class="label" data-i18n="whatToGet">Ano ang kukunin?</span>
            <div class="chips" id="extract-presets">
              <label class="chip-radio"><input type="radio" name="preset" value="links" checked /><span>🔗 Links</span></label>
              <label class="chip-radio"><input type="radio" name="preset" value="images" /><span>🖼️ Images</span></label>
              <label class="chip-radio"><input type="radio" name="preset" value="headings" /><span>🔠 Headings</span></label>
              <label class="chip-radio"><input type="radio" name="preset" value="paragraphs" /><span>📝 Text</span></label>
              <label class="chip-radio"><input type="radio" name="preset" value="tables" /><span>📊 Tables</span></label>
              <label class="chip-radio"><input type="radio" name="preset" value="custom" /><span>⚙️ Custom</span></label>
            </div>
            <div class="custom-only" hidden>
              <label class="field">
                <span>CSS selector</span>
                <input name="selector" placeholder=".product .price" autocapitalize="off" spellcheck="false" />
              </label>
              <label class="field">
                <span data-i18n="attrOpt">Attribute (optional)</span>
                <input name="attr" placeholder="href, src, data-id" autocapitalize="off" spellcheck="false" />
              </label>
            </div>
            <button class="btn primary block" type="submit" data-i18n="extract">Kunin ang data</button>
          </form>
          <div class="result" id="extract-result" hidden></div>
        </section>

        <!-- ============ AUTOMATE ============ -->
        <section class="view" id="view-automate" data-title="Automate" hidden>
          <div class="card">
            <div class="card-head">
              <h2 data-i18n="steps">Mga Hakbang</h2>
              <select id="automate-template" class="small-select" aria-label="Templates">
                <option value="" data-i18n="templates">Templates…</option>
                <option value="search">Google-style search</option>
                <option value="login">Login form</option>
                <option value="scroll">Scroll &amp; capture</option>
              </select>
            </div>
            <ol class="steps" id="steps"></ol>
            <button class="btn ghost block" id="add-step" type="button">＋ <span data-i18n="addStep">Magdagdag ng hakbang</span></button>
            <div class="row gap">
              <label class="field">
                <span data-i18n="device">Device</span>
                <select id="automate-device" class="device-select"></select>
              </label>
            </div>
            <label class="switch"><input type="checkbox" id="automate-continue" /><span data-i18n="continueOnError">Ituloy kahit may error</span></label>
            <div class="row gap">
              <button class="btn ghost" id="automate-save" type="button" data-i18n="save">I-save</button>
              <button class="btn primary grow" id="automate-run" type="button">▶ <span data-i18n="run">Patakbuhin</span></button>
            </div>
            <div id="saved-flows" class="saved-flows"></div>
          </div>
          <div class="result" id="automate-result" hidden></div>
        </section>

        <!-- ============ INSPECT ============ -->
        <section class="view" id="view-inspect" data-title="Inspect" hidden>
          <form class="card form" id="inspect-form">
            <label class="field">
              <span>Website URL</span>
              <input name="url" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://example.com" required />
            </label>
            <label class="field">
              <span data-i18n="device">Device</span>
              <select name="device" class="device-select"></select>
            </label>
            <button class="btn primary block" type="submit" data-i18n="analyze">Suriin ang page</button>
          </form>
          <div class="result" id="inspect-result" hidden></div>
        </section>
      </main>

      <nav class="tabbar" aria-label="Main">
        <button data-view="live" class="active">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
          <span>Live</span>
        </button>
        <button data-view="capture">
          <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z" /><circle cx="12" cy="13" r="3.5" /></svg>
          <span>Capture</span>
        </button>
        <button data-view="extract">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7M17 14v7M14 18l3 3 3-3" /></svg>
          <span>Extract</span>
        </button>
        <button data-view="automate">
          <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" /></svg>
          <span>Automate</span>
        </button>
        <button data-view="inspect">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></svg>
          <span>Inspect</span>
        </button>
      </nav>
    </div>

    <!-- Bottom sheet -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" id="sheet-close" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <template id="tpl-settings">
      <div class="settings">
        <label class="field">
          <span data-i18n="language">Wika / Language</span>
          <select id="set-lang">
            <option value="fil">Filipino</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="theme">Tema</span>
          <select id="set-theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label class="field">
          <span data-i18n="timeout">Timeout (segundo)</span>
          <input id="set-timeout" type="number" min="5" max="120" inputmode="numeric" />
        </label>
        <label class="field">
          <span data-i18n="waitUntil">Hintayin hanggang</span>
          <select id="set-wait">
            <option value="networkidle2">Network halos tahimik (recommended)</option>
            <option value="networkidle0">Network tahimik</option>
            <option value="load">Load event</option>
            <option value="domcontentloaded">DOM ready (pinakamabilis)</option>
          </select>
        </label>
        <div class="info-box" id="set-info"></div>
        <button class="btn ghost block" id="set-clear" type="button" data-i18n="clearData">Burahin ang history at saved flows</button>
        <button class="btn danger block" id="set-logout" type="button" data-i18n="logout">Mag-logout</button>
      </div>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
